paths = ["../libhuseyn"]

[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tkernel/linker.ld",
    "-C", "code-model=kernel",
    "-C", "relocation-model=static",
    "-C", "panic=abort",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
